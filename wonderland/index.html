        drawFallbackLine(start.lat, start.lng, ride.location.lat, ride.location.lng, startName, ride.name);
        return;
      }
      
      route.distance += startNode.dist + endNode.dist;
      drawRoute(route, startName, ride.name);
    }
    
    // Show start selector
    function showStartSelector(destinationRide) {
      pendingDestination = destinationRide;
      const selector = document.getElementById('startSelector');
      const optionsList = document.getElementById('startOptionsList');
      
      let html = '';
      
      // User location option
      if (userLocation) {
        const inPark = isInsidePark(userLocation.lat, userLocation.lng);
        html += `
          <div class="start-option" data-type="user" ${!inPark ? 'style="opacity:0.5"' : ''}>
            <div class="start-option-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>
            </div>
            <div class="start-option-text">
              <div class="start-option-title">Your location</div>
              <div class="start-option-desc">${inPark ? 'Currently in the park' : 'Outside the park'}</div>
            </div>
          </div>`;
      }
      
      // Main entrance
      html += `
        <div class="start-option" data-type="entrance">
          <div class="start-option-icon">
            <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          </div>
          <div class="start-option-text">
            <div class="start-option-title">Main Entrance</div>
            <div class="start-option-desc">Park front gate</div>
          </div>
        </div>`;
      
      // Nearby rides
      const nearbyRides = rides
        .filter(r => r.id !== destinationRide.id && r.location?.lat)
        .map(r => ({ ride: r, dist: haversineM(destinationRide.location.lat, destinationRide.location.lng, r.location.lat, r.location.lng) }))
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 5);
      
      for (const { ride, dist } of nearbyRides) {
        html += `
          <div class="start-option" data-type="ride" data-ride-id="${ride.id}">
            <div class="start-option-icon orange">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="start-option-text">
              <div class="start-option-title">${ride.name}</div>
              <div class="start-option-desc">${ride.park_area} · ${Math.round(dist)}m away</div>
            </div>
          </div>`;
      }
      
      optionsList.innerHTML = html;
      
      optionsList.querySelectorAll('.start-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const type = opt.dataset.type;
          let startPoint = null;
          
          if (type === 'user' && userLocation) {
            startPoint = { ...userLocation, type: 'user' };
          } else if (type === 'entrance') {
            startPoint = { ...PARK_ENTRANCE, type: 'entrance' };
          } else if (type === 'ride') {
            const ride = rides.find(r => r.id === opt.dataset.rideId);
            if (ride) startPoint = { lat: ride.location.lat, lng: ride.location.lng, type: 'ride', name: ride.name };
          }
          
          const destination = pendingDestination;
          hideStartSelector();
          if (destination) getDirectionsToRide(destination, startPoint);
        });
      });
      
      selector.classList.add('visible');
    }
    
    // Hide start selector
    function hideStartSelector() {
      document.getElementById('startSelector').classList.remove('visible');
      pendingDestination = null;
    }
    
    // Handle walk button click
    window.handleWalkHereClick = function(rideId) {
      const ride = rides.find(r => r.id === rideId);
      if (!ride) return;
      
      map.closePopup();
      snapSheet('peek');
      
      if (userLocation && isInsidePark(userLocation.lat, userLocation.lng)) {
        getDirectionsToRide(ride, { ...userLocation, type: 'user' });
      } else {
        showStartSelector(ride);
      }
    };
    
    // Handle clear route
    window.handleClearRoute = function() { clearRoute(); };
    
    // Add directions UI to DOM
    (function initDirectionsUI() {
      // Directions bar
      const directionsBar = document.createElement('div');
      directionsBar.id = 'directionsBar';
      directionsBar.className = 'directions-bar';
      directionsBar.innerHTML = `
        <div class="directions-info">
          <div class="directions-route"></div>
          <div class="directions-stats">
            <span class="directions-stat directions-dist">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </span>
            <span class="directions-stat directions-time">
              <svg viewBox="0 0 24 24"><path d="M13 4h-2l-1 7h4l-1-7z"/><circle cx="12" cy="2.5" r="1.5"/><path d="M9 22l3-8 3 8M7 12l2 4M17 12l-2 4"/></svg>
            </span>
          </div>
        </div>
        <button class="directions-close-btn" onclick="handleClearRoute()" aria-label="Clear">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      `;
      document.body.appendChild(directionsBar);
      
      // Start selector
      const startSelector = document.createElement('div');
      startSelector.id = 'startSelector';
      startSelector.className = 'start-selector';
      startSelector.innerHTML = `
        <div class="start-selector-panel">
          <h3>Choose starting point</h3>
          <div id="startOptionsList"></div>
        </div>
      `;
      startSelector.addEventListener('click', (e) => {
        if (e.target === startSelector) hideStartSelector();
      });
      document.body.appendChild(startSelector);
      
      // No-route toast
      const toast = document.createElement('div');
      toast.id = 'noRouteToast';
      toast.className = 'no-route-toast';
      toast.textContent = 'No walking path found. Showing straight-line distance.';
      document.body.appendChild(toast);
    })();
  </script>
</body>
</html>
